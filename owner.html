<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>イベントガチャ｜オーナー管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#101522,#202b45);
  color:#fff;
}

header{
  padding:25px 20px;
  background:rgba(0,0,0,.35);
  border-bottom:1px solid rgba(255,255,255,.15);
}

h1{
  margin:0;
  font-size:25px;
}

.container{
  padding:20px;
  max-width:700px;
  margin:auto;
}

.card{
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  backdrop-filter:blur(10px);
}

h2{
  margin-top:0;
  font-size:20px;
}

label{
  display:block;
  margin-top:14px;
  margin-bottom:6px;
  color:#ccd5e8;
}

input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:0;
  font-size:16px;
  background:#fff;
  color:#111;
}

button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border-radius:10px;
  border:0;
  font-size:16px;
  font-weight:bold;
  background:#37d39a;
  color:#07130e;
}

button.blue{
  background:#5795ff;
  color:#fff;
}

button.red{
  background:#ff5d70;
  color:#fff;
}

.prize{
  padding:14px;
  margin-top:10px;
  background:rgba(0,0,0,.25);
  border-radius:12px;
}

.prize img{
  max-width:120px;
  margin-top:8px;
  border-radius:8px;
}

.rate{
  color:#8fffd0;
  font-weight:bold;
}

.ticket{
  padding:12px;
  margin-top:8px;
  background:rgba(255,255,255,.08);
  border-radius:10px;
  word-break:break-all;
}

.small{
  color:#9da9bf;
  font-size:13px;
}

.loading{
  padding:15px;
  text-align:center;
  color:#9da9bf;
}

.success{
  color:#8fffd0;
}

.error{
  color:#ff8c9a;
}
</style>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://rosudqtzqadtvpzmeams.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PEkWdcokJff8hPvRGnlP_g_jlOggB7Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
</script>

</head>

<body>

<header>
  <h1>🎰 イベントガチャ｜オーナー管理</h1>
  <div class="small">管理者専用ページ</div>
</header>

<div class="container">

<!-- 設定 -->
<div class="card">

<h2>⚙️ ガチャ設定</h2>

<label>ガチャタイトル</label>

<input
  id="title"
  value="イベントガチャ"
>

<label>1回に必要なチケット</label>

<input
  id="ticketCost"
  type="number"
  value="1"
  min="1"
>

<button onclick="saveSettings()">
設定を保存
</button>

</div>


<!-- 景品追加 -->
<div class="card">

<h2>🎁 景品を追加</h2>

<label>景品名</label>

<input
  id="prizeName"
  placeholder="例：限定アイテム"
>

<label>レア度</label>

<input
  id="rarity"
  placeholder="例：SSR"
>

<label>排出率（%）</label>

<input
  id="rate"
  type="number"
  step="0.01"
  placeholder="例：1"
>

<label>景品画像URL</label>

<input
  id="image"
  placeholder="https://..."
>

<label>在庫数</label>

<input
  id="stock"
  type="number"
  value="1"
  min="1"
>

<button onclick="addPrize()">
景品を追加
</button>

<div id="message"></div>

</div>


<!-- 景品一覧 -->
<div class="card">

<h2>🎁 登録済み景品</h2>

<div id="prizeList">
  <div class="loading">
    景品を読み込んでいます…
  </div>
</div>

</div>


<!-- チケット -->
<div class="card">

<h2>🎫 チケット発行</h2>

<label>発行枚数</label>

<input
  id="ticketCount"
  type="number"
  value="10"
  min="1"
>

<button
  class="blue"
  onclick="createTickets()"
>
ランダムチケットを発行
</button>

<div id="ticketList"></div>

</div>


<!-- 現在の設定 -->
<div class="card">

<h2>📊 現在の設定</h2>

<div id="summary">
読み込み中…
</div>

</div>


<!-- 履歴 -->
<div class="card">

<h2>📜 ガチャ結果</h2>

<div id="history">
  <p class="small">
    ガチャ結果はここに表示されます。
  </p>
</div>

</div>

</div>


<script>

/* =========================
   基本設定
========================= */

let prizes = [];
let tickets = [];


/* =========================
   イベントガチャID取得
========================= */

async function getGachaId(){
  return "f56d4eb6-148f-4070-911f-6f96991b4c6b";
}


/* =========================
   景品読み込み
========================= */

async function loadPrizes(){

  const list =
    document.getElementById("prizeList");

  list.innerHTML =
    '<div class="loading">読み込み中…</div>';

  try{

    const gachaId =
      await getGachaId();

    const { data, error } =
      await supabaseClient
        .from("gacha_prizes")
        .select("*")
        .eq("gacha_id",gachaId)
        .order("sort",{ascending:true});

    if(error){

  console.error(error);

  list.innerHTML =
    '<p class="error">読み込みエラー：' +
    escapeHtml(error.message) +
    '</p>';

  return;
}

    prizes =
      (data || []).map(p => ({

        id:p.id,

        name:p.name,

        rarity:
          p.rarity ??
          p.rarely ??
          "",

        rate:Number(
          p.probability ?? 0
        ),

        image:
          p.image ??
          p.image_url ??
          "",

        stock:Number(
          p.stok ?? 0
        ),

        sort:Number(
          p.sort ?? 0
        )

      }));

    renderPrizes();
    renderSummary();

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<p class="error">' +
      error.message +
      '</p>';

  }

}


/* =========================
   景品表示
========================= */

function renderPrizes(){

  const list =
    document.getElementById("prizeList");

  list.innerHTML = "";

  if(prizes.length === 0){

    list.innerHTML =
      '<p class="small">まだ景品が登録されていません。</p>';

    return;
  }

  prizes.forEach(p => {

    const div =
      document.createElement("div");

    div.className = "prize";

    div.innerHTML = `

      <strong>
        ${escapeHtml(p.name)}
      </strong>

      <br>

      レア度：
      <span class="rate">
        ${escapeHtml(p.rarity)}
      </span>

      <br>

      排出率：
      <span class="rate">
        ${p.rate}%
      </span>

      <br>

      在庫：
      <span class="rate">
        ${p.stock}
      </span>

      ${
        p.image
        ?
        `
        <br>
        <img
          src="${escapeHtml(p.image)}"
          alt=""
        >
        `
        :
        ""
      }

      <button
        class="red"
        onclick="deletePrize('${p.id}')"
      >
        この景品を削除
      </button>

    `;

    list.appendChild(div);

  });

}


/* =========================
   景品追加
========================= */

async function addPrize(){

  const name =
    document
      .getElementById("prizeName")
      .value
      .trim();

  const rarity =
    document
      .getElementById("rarity")
      .value
      .trim();

  const rate =
    parseFloat(
      document
        .getElementById("rate")
        .value
    );

  const image =
    document
      .getElementById("image")
      .value
      .trim();

  const stock =
    parseInt(
      document
        .getElementById("stock")
        .value
    );


  if(
    !name ||
    !rarity ||
    isNaN(rate)
  ){

    alert(
      "景品名・レア度・排出率を入力してください"
    );

    return;
  }


  if(isNaN(stock) || stock < 1){

    alert(
      "在庫数を1以上で入力してください"
    );

    return;
  }


  const message =
    document.getElementById("message");

  message.innerHTML =
    '<p class="small">登録中…</p>';


  try{

    const gachaId =
      await getGachaId();


    const nextSort =
      prizes.length > 0
      ?
      Math.max(
        ...prizes.map(p => p.sort || 0)
      ) + 1
      :
      1;


    const { error } =
      await supabaseClient
        .from("gacha_prizes")
        .insert({

          name:name,

          rarity:rarity,

          probability:rate,

          gacha_id:gachaId,

          image:image || null,

          stok:stock,

          sort:nextSort

        });


    if(error){

      console.error(error);

      message.innerHTML =
        '<p class="error">' +
        "登録エラー：" +
        escapeHtml(error.message) +
        "</p>";

      return;
    }


    document
      .getElementById("prizeName")
      .value = "";

    document
      .getElementById("rarity")
      .value = "";

    document
      .getElementById("rate")
      .value = "";

    document
      .getElementById("image")
      .value = "";

    document
      .getElementById("stock")
      .value = "1";


    message.innerHTML =
      '<p class="success">景品を登録しました！</p>';


    await loadPrizes();

  }catch(error){

    console.error(error);

    message.innerHTML =
      '<p class="error">' +
      escapeHtml(error.message) +
      '</p>';

  }

}


/* =========================
   景品削除
========================= */

async function deletePrize(id){

  if(
    !confirm(
      "この景品を削除しますか？"
    )
  ){

    return;
  }


  const { error } =
    await supabaseClient
      .from("gacha_prizes")
      .delete()
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "削除できませんでした：" +
      error.message
    );

    return;
  }


  await loadPrizes();

}


/* =========================
   チケット発行
========================= */

function createTickets(){

  const count =
    parseInt(
      document
        .getElementById("ticketCount")
        .value
    );


  if(!count || count < 1){

    alert(
      "発行枚数を入力してください"
    );

    return;
  }


  for(
    let i = 0;
    i < count;
    i++
  ){

    const code =
      "GACHA-" +

      Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase() +

      "-" +

      Math.random()
        .toString(36)
        .substring(2,8)
        .toUpperCase();


    tickets.push({

      code:code,

      used:false,

      created:
        new Date()
          .toLocaleString("ja-JP")

    });

  }


  renderTickets();

  renderSummary();

}


/* =========================
   チケット表示
========================= */

function renderTickets(){

  const list =
    document.getElementById(
      "ticketList"
    );

  list.innerHTML = "";


  tickets
    .slice()
    .reverse()
    .forEach(t => {

      list.innerHTML += `

        <div class="ticket">

          🎫
          <strong>
            ${escapeHtml(t.code)}
          </strong>

          <br>

          <span class="small">

            ${
              t.used
              ?
              "使用済み"
              :
              "未使用"
            }

            ｜

            ${escapeHtml(t.created)}

          </span>

        </div>

      `;

    });

}


/* =========================
   設定表示
========================= */

function renderSummary(){

  const totalRate =
    prizes.reduce(
      (sum,p) =>
        sum + Number(p.rate),
      0
    );


  document
    .getElementById("summary")
    .innerHTML = `

      景品数：
      <strong>
        ${prizes.length}
      </strong>

      <br><br>

      排出率合計：
      <strong>
        ${totalRate.toFixed(2)}%
      </strong>

      <br><br>

      発行チケット：
      <strong>
        ${tickets.length}
      </strong>

      <br><br>

      未使用チケット：
      <strong>
        ${tickets.filter(t => !t.used).length}
      </strong>

    `;

}


/* =========================
   設定保存
========================= */

async function saveSettings(){

  const title =
    document
      .getElementById("title")
      .value
      .trim();

  const ticketCost =
    parseInt(
      document
        .getElementById("ticketCost")
        .value
    );


  if(!title){

    alert(
      "タイトルを入力してください"
    );

    return;
  }


  try{

    const gachaId =
      await getGachaId();


    const { data, error } =
      await supabaseClient
        .from("gachas")
        .update({
          name:title
        })
        .eq("id",gachaId)
        .select();


    if(error){

      console.error(error);

      alert(
        "設定保存エラー：" +
        error.message
      );

      return;
    }


    alert(
      "設定を保存しました！"
    );

  }catch(error){

    console.error(error);

    alert(
      error.message
    );

  }

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(str){

  return String(str)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
/* =========================
   起動
========================= */

async function start(){
  await loadPrizes();
  renderTickets();
  renderSummary();
}

start();

</script>

</body>
</html>
